<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocab Master & Reflex Training</title>
  <style>
    :root {
      --ink: #322b24; --pink: #d95d43; --yellow: #f0b736;
      --paper: #fffaf0; --shadow: 7px 8px 0 rgba(66, 53, 37, .22);
      /* Tactical Theme Colors */
      --tac-dark: #1f2326; --tac-red: #ff4655; --tac-cyan: #00ffff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: "Comic Sans MS", "Segoe Print", "Noto Sans Thai", system-ui, sans-serif;
      background: #b6d0b8; padding: 28px 18px 44px; transition: background 0.5s ease;
    }
    body.tactical-mode { background: #0f1923; color: #ece8e1; }

    .app { width: min(960px, 100%); margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-weight: 900; font-size: clamp(1.15rem, 3vw, 1.55rem); }
    .score-pill { padding: 9px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fffdf6; font-weight: 900; }
    
    body.tactical-mode .score-pill { background: var(--tac-dark); border-color: var(--tac-red); color: #ece8e1; }
    .game-card { background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); transition: all 0.5s ease; }
    body.tactical-mode .game-card { background: var(--tac-dark); border-color: var(--tac-red); box-shadow: 7px 8px 0 var(--tac-red); }

    .hero { padding: 25px 32px; border-bottom: 2px solid var(--ink); background: #fffaf0; text-align: center; }
    body.tactical-mode .hero { background: #182027; border-color: var(--tac-red); }
    h1 { margin: 0 0 10px; font-size: 2rem; }

    /* AIM TRAINER STYLES */
    .aim-area { padding: 20px; }
    .aim-hud { display: flex; justify-content: space-between; font-weight: 900; margin-bottom: 15px; font-size: 1.2rem; align-items: center; }
    .target-prompt { flex: 1; text-align: center; font-size: 1.6rem; color: var(--tac-cyan); text-shadow: 1px 1px 0px rgba(0,255,255,0.3); margin: 0 20px; border: 2px dashed var(--tac-cyan); border-radius: 10px; padding: 10px; }
    .aim-playground { position: relative; width: 100%; height: 500px; background: #111; border: 3px solid #333; border-radius: 8px; overflow: hidden; }
    
    .vocab-target {
      position: absolute; display: grid; place-items: center; padding: 10px 20px;
      background: var(--tac-dark); color: white; border: 2px solid var(--tac-cyan);
      border-radius: 20px; font-weight: bold; font-size: 1.2rem; cursor: crosshair;
      user-select: none; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.1s;
    }
    .vocab-target:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.8); }
    .vocab-target.wrong { border-color: var(--tac-red); box-shadow: 0 0 15px rgba(255, 70, 85, 0.8); color: var(--tac-red); }

    .aim-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; }
    .aim-overlay h2 { font-size: 3rem; margin: 0; color: var(--tac-cyan); }
    .start-aim-btn { margin-top: 20px; padding: 15px 30px; font-size: 1.2rem; background: var(--tac-red); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    
    @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (max-width: 720px) { .aim-playground { height: 400px; } .target-prompt { font-size: 1.1rem; } }
  </style>
</head>
<body class="tactical-mode">
  <main class="app">
    <header class="topbar">
      <div class="logo">✦ AGENT VOCAB DRILL</div>
      <div class="score-pill">⭐ Score: <span id="aimScore">0</span></div>
    </header>

    <section class="game-card">
      <div class="hero">
        <h1 id="heroTitle">ทดสอบการตอบสนองคำศัพท์</h1>
        <p style="color: #b9b5ae;">คลิกคำศัพท์ภาษาอังกฤษที่ตรงกับ "ความหมาย" ที่กำหนดให้เร็วที่สุด!</p>
      </div>

      <div class="aim-area" id="aimArea">
        <div class="aim-hud">
          <div>⏳ <span id="aimTimer" style="color:var(--tac-cyan);">45</span>s</div>
          <div class="target-prompt" id="aimPromptMeaning">เตรียมพร้อม...</div>
          <div>🎯 <span id="aimCombo" style="color:var(--yellow);">Combo: 0</span></div>
        </div>
        
        <div class="aim-playground" id="aimPlayground">
          <div class="aim-overlay" id="aimOverlay">
            <h2 id="aimOverTitle">REFLEX ROOM</h2>
            <button class="start-aim-btn" id="startAimBtn">START DRILL</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    // ข้อมูลคำศัพท์จากรูปภาพ
    
const vocabList = [
  { v: 'abandon', s: 'desert', m: 'ละทิ้ง' },
  { v: 'abate', s: 'lessen', m: 'บรรเทา, เบาบาง' },
  { v: 'abbreviate', s: 'shorten', m: 'ย่อ, ทำให้สั้นลง' },
  { v: 'abdicate', s: 'end', m: 'สละ, ลาออก' },
  { v: 'abduct', s: 'kidnap', m: 'ลักพาตัว' },
  { v: 'abolish', s: 'cancel, end', m: 'ยกเลิก, ล้มเลิก' },
  { v: 'abortion', s: 'miscarriage', m: 'การทำแท้ง' },
  { v: 'abortive', s: 'useless, unsuccessful', m: 'ไม่มีประโยชน์, ไร้ผล' },
  { v: 'abridge', s: 'concise', m: 'ย่อ' },
  { v: 'absorb', s: 'take in', m: 'ดูดซับ, ซึมซับ' },
  { v: 'absolutely', s: 'completely', m: 'อย่างยิ่ง, โดยสิ้นเชิง' },
  { v: 'abstract', s: 'unreal', m: 'นามธรรม, ไม่จริง' },
  { v: 'abusing', s: 'misusing', m: 'ใช้ในทางผิด' },
  { v: 'accessible', s: 'reachable', m: 'ที่สามารถเข้าได้' },
  { v: 'accessory', s: 'additional, supplementary', m: 'เพิ่มเติม' },
  { v: 'accelerate', s: 'increase, expedite', m: 'เร่งความเร็ว' },
  { v: 'accommodation', s: 'residence', m: 'ที่พักอาศัย' },
  { v: 'accomplish', s: 'succeed', m: 'ทำให้สำเร็จ' },
  { v: 'accumulate', s: 'collect', m: 'สะสม' },
  { v: 'accurate', s: 'correct, precise', m: 'ถูกต้องแม่นยำ' },
  { v: 'accuse', s: 'blame, charge with', m: 'กล่าวหา, ตำหนิ' },
  { v: 'acquire', s: 'attain', m: 'ได้รับ' },
  { v: 'activate', s: 'stimulate', m: 'กระตุ้น' },
  { v: 'adapt', s: 'adjust', m: 'ปรับ' },
  { v: 'admire', s: 'respect', m: 'ชื่นชม, นับถือ' },
  { v: 'admit', s: 'accept', m: 'ยอมรับ' },
  { v: 'admonish', s: 'reprimand', m: 'แนะนำ, ตักเตือน' },
  { v: 'adolescent', s: 'youngster', m: 'วัยรุ่น' },
  { v: 'adopt', s: 'foster', m: 'รับเลี้ยง, รับเอามา' },
  { v: 'advantage', s: 'benefit', m: 'ข้อดี' }
];


    const $ = (s) => document.querySelector(s);
    let aimGameTimer, moveTimer;
    let aimTime = 60; 
    let aimScore = 0;
    let combo = 0;
    let currentPrompt = null;
    let targetsArray = [];

    $('#startAimBtn').onclick = () => {
      $('#aimOverlay').style.display = 'none';
      aimTime = 45; aimScore = 0; combo = 0;
      updateHUD();
      startGameLoop();
      nextVocabRound();
    };

    function updateHUD() {
      $('#aimTimer').textContent = aimTime;
      $('#aimScore').textContent = aimScore;
      $('#aimCombo').textContent = `Combo: ${combo}`;
    }

    function startGameLoop() {
      aimGameTimer = setInterval(() => {
        aimTime--;
        updateHUD();
        if(aimTime <= 0) endAimGame();
      }, 1000);

      // ทำให้เป้าหมายขยับทุกๆ 1.5 วินาทีเพื่อความท้าทาย
      moveTimer = setInterval(() => {
        document.querySelectorAll('.vocab-target').forEach(el => {
            const sizeW = 120; const sizeH = 40;
            const maxX = $('#aimPlayground').clientWidth - sizeW;
            const maxY = $('#aimPlayground').clientHeight - sizeH;
            el.style.left = `${Math.random() * maxX}px`;
            el.style.top = `${Math.random() * maxY}px`;
        });
      }, 1800);
    }

    function nextVocabRound() {
      $('#aimPlayground').innerHTML = ''; // Clear old targets
      if(aimTime <= 0) return;

      // สุ่มคำถามปัจจุบัน
      currentPrompt = vocabList[Math.floor(Math.random() * vocabList.length)];
      $('#aimPromptMeaning').innerHTML = `"${currentPrompt.m}" <br><span style="font-size:1rem; color:#8dbca1;">(Synonym: ${currentPrompt.s})</span>`;
      
      // ดึงตัวหลอกมา 3-4 คำ
      let distractors = vocabList.filter(v => v.v !== currentPrompt.v).sort(() => 0.5 - Math.random()).slice(0, 3);
      
      let spawnList = [currentPrompt, ...distractors];
      spawnList.sort(() => 0.5 - Math.random()); // สลับตำแหน่งคำตอบ

      spawnList.forEach(vocab => {
        const target = document.createElement('div');
        target.className = 'vocab-target';
        target.textContent = vocab.v;
        
        const sizeW = 120; const sizeH = 40;
        const maxX = $('#aimPlayground').clientWidth - sizeW - 20;
        const maxY = $('#aimPlayground').clientHeight - sizeH - 20;
        target.style.left = `${Math.random() * maxX + 10}px`;
        target.style.top = `${Math.random() * maxY + 10}px`;

        target.onmousedown = () => {
          if (vocab.v === currentPrompt.v) {
            // ตอบถูก
            combo++;
            let points = 10 + (combo * 2); // ยิ่งคอมโบเยอะ ยิ่งได้แต้มเยอะ
            aimScore += points;
            target.style.background = 'var(--tac-cyan)';
            target.style.color = '#000';
            setTimeout(nextVocabRound, 150);
          } else {
            // ตอบผิด
            combo = 0;
            aimScore = Math.max(0, aimScore - 5);
            target.classList.add('wrong');
            target.textContent = '❌';
            setTimeout(() => target.remove(), 400);
          }
          updateHUD();
        };

        $('#aimPlayground').appendChild(target);
      });
    }

    function endAimGame() {
      clearInterval(aimGameTimer);
      clearInterval(moveTimer);
      $('#aimPlayground').innerHTML = ''; 
      $('#aimPromptMeaning').textContent = 'จบการทดสอบ!';
      
      const overlay = $('#aimOverlay');
      overlay.style.display = 'flex';
      $('#aimOverTitle').textContent = 'TIME UP!';
      
      let rank = 'IRON';
      if (aimScore > 300) rank = 'RADIANT 👑';
      else if (aimScore > 200) rank = 'DIAMOND 💎';
      else if (aimScore > 100) rank = 'GOLD 🏆';

      let resultHTML = document.createElement('div');
      resultHTML.innerHTML = `
        <p style="color:white; font-size:1.5rem; margin-top:10px;">คะแนนรวม: <span style="color:var(--tac-cyan); font-weight:bold;">${aimScore}</span></p>
        <p style="color:var(--yellow); font-size:1.2rem;">RANK: ${rank}</p>
      `;
      
      // ลบปุ่มเก่าก่อน
      const oldBtn = $('#startAimBtn');
      if (oldBtn) oldBtn.remove();
      
      const btn = document.createElement('button');
      btn.className = 'start-aim-btn'; 
      btn.id = 'startAimBtn';
      btn.textContent = 'เล่นอีกครั้ง';
      btn.onclick = () => { overlay.innerHTML = '<h2 id="aimOverTitle">REFLEX ROOM</h2>'; overlay.appendChild(btn); $('#startAimBtn').click(); };
      
      overlay.appendChild(resultHTML);
      overlay.appendChild(btn);
    }
  </script>
</body>
</html>
